<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>◈ CRASHER MD - PAIR ◈</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
.card{border:1px solid #333;padding:30px;border-radius:20px;background:#0a0a0a;width:90%;max-width:400px;text-align:center;box-shadow:0 0 30px #111}
.logo{width:90px;height:90px;border-radius:50%;border:2px solid #fff;margin-bottom:15px}
h1{font-size:18px;margin-bottom:5px;letter-spacing:2px}
p{font-size:12px;color:#888;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;outline:none;text-align:center;font-size:14px;margin-bottom:12px}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#fff;color:#000;font-weight:900;cursor:pointer;letter-spacing:1px}
button:active{transform:scale(0.98)}
#code{margin-top:20px;padding:15px;background:#111;border:1px dashed #333;border-radius:12px;font-size:22px;letter-spacing:4px;display:none}
.footer{margin-top:20px;font-size:10px;color:#555}
.tag{font-size:10px;background:#fff;color:#000;padding:3px 8px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="https://files.catbox.moe/hhafg3.jpg" alt="pfp">
<h1>◈┈▉ `ｃｒａｓｈｅｒ ｍｄ` ▉┄◈</h1>
<p>⚡ ᴘᴏᴡᴇʀ • ꜱᴘᴇᴇᴅ • ᴄᴏɴᴛʀᴏʟ</p>
<span class="tag">PAIRING METHOD</span><br><br>
<input id="number" type="text" placeholder="2348071569915 - no +">
<button onclick="getCode()">GET PAIR CODE</button>
<div id="code"></div>
<div id="status" style="margin-top:15px;font-size:12px;color:#aaa"></div>
<div class="footer">🐺 ᴄʀᴀꜱʜᴇʀ ᴍᴅ — 𝟸𝟶𝟸𝟼<br>Owner: 2348071569915<br>Render Ready</div>
</div>

<script>
async function getCode(){
  let num = document.getElementById('number').value.trim()
  let codeDiv = document.getElementById('code')
  let status = document.getElementById('status')
  if(!num){ status.innerText='❌ Enter number with country code'; return; }
  status.innerText='⏳ Requesting code...'
  codeDiv.style.display='none'
  try{
    let res = await fetch('/pair?number='+num)
    let data = await res.json()
    if(data.code){
      codeDiv.innerText = data.code
      codeDiv.style.display='block'
      status.innerText='✅ Copy code & paste in WhatsApp > Linked Devices > Link with phone number'
    } else {
      status.innerText='❌ '+(data.error||'Failed, try again')
    }
  }catch(e){
    status.innerText='❌ Server error, check Render logs'
  }
}
</script>
</body>
  </html>
